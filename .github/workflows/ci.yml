name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_desk"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_desk
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests (no Groq calls)
        run: uv run pytest -m "not llm" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests
        run: npm test

  image:
    # The image Render deploys. Render waits for CI (autoDeployTrigger: checksPass), so a
    # broken Dockerfile fails here instead of in a deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f backend/Dockerfile -t support-desk-api .
      - name: The MCP server and the embedding model are in the image
        run: |
          docker run --rm support-desk-api sh -c \
            'test -f /app/mcp_server/dist/index.js && node --version && ls .cache/fastembed | grep -q .'
